# yaml-language-server: $schema=../../skills/soniccraft/reference/timeline-schema.json
#
# Mock-only twin of timeline.yaml: every voice is SonicCraft's built-in deterministic `mock` voice
# (vowel-like tone bursts with exact word timings), so it renders on any OS with no API keys, no
# network and no system TTS. CI renders this file on Linux and macOS. Each speaker gets its own
# voice_id; the mock voice derives a distinct pitch from it.
#
#   soniccraft render <this file>    # offline-demo-mock.wav + subtitles + manifest
version: "1.0"
title: "SonicCraft offline demo (mock voices)"
description: "Three-turn briefing over a ducked synthwave bed, rendered with the deterministic mock voice."

output:
  path: offline-demo-mock.wav
  format: wav
  bit_depth: 16
  loudness_preset: podcast # -16 LUFS integrated, -1.0 dBTP true-peak ceiling
  export_subtitles: [vtt, srt, json, transcript]
  export_manifest: true

speakers:
  narrator:
    provider: mock
    voice_id: narrator
    label: Narrator
  guest:
    provider: mock
    voice_id: guest
    label: Guest
  robot:
    provider: mock
    voice_id: robot
    label: Robot

tracks:
  - id: ambient_bed
    type: music
    source: assets/audio/synthwave_loop.wav
    loop: true # no length given: an open-ended bed that runs to the end of the timeline
    volume: 0.65
    fade_in_ms: 1200
    fade_out_ms: 2500 # also sets the tail: the bed fades out 2.5 s after the last sound
    ducking:
      trigger_tracks: [voice_primary, voice_secondary, voice_robot]
      reduction_db: -18
      attack_ms: 80
      release_ms: 350

  - id: voice_primary
    type: speech
    speaker: narrator
    pan: -0.15
    sequence:
      - id: cue_01
        text: "Autonomous software development requires deterministic compilation targets."
      - pause_duration: 350ms
      - id: cue_03
        text: "By separating high-level planning from digital signal processing, systems eliminate runtime hallucinations."

  - id: voice_secondary
    type: speech
    speaker: guest
    pan: 0.15
    sequence:
      - id: cue_02
        start_relative: { after_cue: cue_01, offset_ms: 150 }
        text: "Exactly. SonicCraft treats audio composition the same way Hyperframes treated web-based video."

  - id: voice_robot
    type: speech
    speaker: robot
    sequence:
      - id: cue_04
        start_relative: { after_cue: cue_03, offset_ms: 900 }
        text: "Rendered offline. Zero API keys."

  - id: sfx_impact
    type: sfx
    source: assets/sfx/whoosh.wav
    volume: 0.8
    start_at_ms: 0

  - id: sfx_outro
    type: sfx
    clips:
      - id: outro_hit
        source: assets/sfx/impact.wav
        start_relative: { after_cue: cue_03, offset_ms: 150 }
        volume: 0.7
      - id: outro_chime
        source: assets/sfx/chime.wav
        start_relative: { after_cue: cue_04, offset_ms: 250 }
