<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">SonicCraft</title>
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sc-bg)"/>
  <!-- the music bed: a wave that ducks under the speech -->
  <path d="M60 318 C 104 286, 132 286, 160 314 C 200 352, 312 352, 352 314 C 380 286, 408 286, 452 318"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="20" stroke-linecap="round"/>
  <!-- the speech: waveform bars on a shared timeline -->
  <g fill="#FFFFFF">
    <rect x="118" y="221" width="20" height="70" rx="10"/>
    <rect x="150" y="191" width="20" height="130" rx="10"/>
    <rect x="182" y="156" width="20" height="200" rx="10"/>
    <rect x="214" y="121" width="20" height="270" rx="10"/>
    <rect x="246" y="166" width="20" height="180" rx="10"/>
    <rect x="278" y="136" width="20" height="240" rx="10"/>
    <rect x="310" y="181" width="20" height="150" rx="10"/>
    <rect x="342" y="206" width="20" height="100" rx="10"/>
    <rect x="374" y="226" width="20" height="60" rx="10"/>
  </g>
</svg>
