[package]
name = "soniccraft-core"
description = "SonicCraft timeline DSL: parsing, validation, lowering and JSON Schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/soniccraft-core"
readme = "README.md"
keywords = ["audio", "timeline", "dsl", "json-schema", "yaml"]
categories = ["parser-implementations", "multimedia::audio"]
# The published crate: sources, README and license texts.
# The tests stay in the repository and run there.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
strsim.workspace = true

[dev-dependencies]
jsonschema.workspace = true
