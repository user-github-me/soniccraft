[package]
name = "soniccraft-mcp"
description = "SonicCraft Model Context Protocol server (stdio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/soniccraft-mcp"
readme = "README.md"
keywords = ["mcp", "mcp-server", "audio", "tts", "agents"]
categories = ["artificial-intelligence", "multimedia::audio"]
# The published crate: sources, the stdio_server example, README and license texts.
# The tests stay in the repository and run there.
include = ["/src", "/examples", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
soniccraft-engine.workspace = true
soniccraft-core.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
tracing-subscriber.workspace = true
