[package]
# The crates.io name: `cargo install soniccraft` installs the `soniccraft` and `soniccraft-mcp` binaries.
# The directory stays crates/soniccraft-cli and the library target soniccraft_cli (see [lib]).
name = "soniccraft"
description = "The SonicCraft CLI and MCP server: validate, plan and render declarative audio timelines (TTS speech, music, sound effects) to loudness-mastered audio with subtitles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/soniccraft"
authors.workspace = true
readme = "README.md"
keywords = ["audio", "tts", "podcast", "loudness", "mcp"]
categories = ["command-line-utilities", "multimedia::audio", "artificial-intelligence"]
# The published crate: sources, the embedded `soniccraft init` templates, README and license texts. The
# integration tests stay in the repository (they use its examples/ and skills/).
include = ["/src", "/templates", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
# The library target only shares code between the two binaries; it is not a stable API.
autobins = false
# `cargo run -p soniccraft -- <args>` runs the main CLI.
default-run = "soniccraft"

# `cargo binstall soniccraft` downloads the GitHub release archive of .github/workflows/release.yml (the
# default flavour, with the LGPL MP3 encoder; licenses/ in the archive) instead of compiling. Each archive
# holds one directory named like it. No third-party builds (QuickInstall): for a target without a release
# archive, cargo-binstall compiles from source like `cargo install`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/soniccraft-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "soniccraft-v{ version }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/soniccraft-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[features]
default = ["mp3"]
# Native MP3 encoding via LAME 3.100 (LGPL-2.0-or-later), statically linked through the LGPL-3.0 crates
# mp3lame-sys and mp3lame-encoder. See licenses/README.md and docs/DESIGN.md §11.
mp3 = ["soniccraft-engine/mp3"]

[lib]
name = "soniccraft_cli"
path = "src/lib.rs"

# Binaries are not documented: `soniccraft-mcp` would overwrite the `soniccraft_mcp` library's docs in
# `cargo doc --workspace` (same output directory), and the CLI is documented by `--help` and the README.
[[bin]]
name = "soniccraft"
path = "src/main.rs"
doc = false

[[bin]]
name = "soniccraft-mcp"
path = "src/bin/soniccraft-mcp.rs"
doc = false

[dependencies]
soniccraft-engine.workspace = true
soniccraft-mcp.workspace = true
soniccraft-core.workspace = true
soniccraft-dsp.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
