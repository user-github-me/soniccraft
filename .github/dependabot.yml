version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref selects the Rust toolchain (`@stable`, the msrv job's `@1.89.0`), not a release of the
      # action, so "updates" would change the Rust version CI tests.
      - dependency-name: dtolnay/rust-toolchain
